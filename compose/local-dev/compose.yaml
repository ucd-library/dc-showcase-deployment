services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: dcf
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../../dc-showcase/services/init/postgres:/docker-entrypoint-initdb.d:ro

  gateway:
    image: ${IMAGE_DC_SHOWCASE_DCS_GATEWAY}
    environment:
      - PORT=3002
      - CLIENT_URL=http://client:8000
      - IIIF_URL=http://iiif:80
      - IIIF_BASE_PATH=/fcgi-bin/iipsrv.fcgi?IIIF=
      - CASKFS_URL=http://cask:3001/cask
      - CASKFS_GOLD_BASE_PATH=/gold/digital-dev
      - CASKFS_USER=dcs-gateway
      - LOG_LEVEL=debug
    depends_on:
      - client
    networks:
      - default
      - argonath-shared
    ports:
      - "3002:3002"

  # Same custom image real dev/prod runs (kustomize/elastic-search/base/
  # statefulset.yaml) - reused directly, single-node, rather than a plain
  # upstream elasticsearch image, so any baked-in analyzer/plugin behavior
  # config.elasticsearch.compactTypeInclude relies on matches real clusters.
  elasticsearch:
    image: ${IMAGE_DC_SHOWCASE_DCS_ELASTIC_SEARCH}
    environment:
      - discovery.type=single-node
      - cluster.name=elasticsearch
      - network.host=0.0.0.0
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - default
      - argonath-shared

  client:
    image: ${IMAGE_DC_SHOWCASE_DCS_CLIENT}
    depends_on:
      - elasticsearch
    environment:
      - CLIENT_ENV=dev
      - PG_HOST=postgres
      - PG_DATABASE=dcf
      - CASK_URL=http://cask:3001
      - CASK_PATH_PREFIX=/cask
      - CASK_USER=dams-dev-service
      - IIIF_HOST=http://iiif
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    volumes:
      - ../../../dc-showcase/services/client/controllers:/app/controllers
      - ../../../dc-showcase/services/client/lib:/app/lib
      - ../../../dc-showcase/services/client/models:/app/models
      - ../../../dc-showcase/services/client/index.js:/app/index.js
      - ../../../dc-showcase/services/client/config.js:/app/config.js
    networks:
      - default
      - argonath-shared
    ports:
      - "8000:8000"

  # dc-showcase's own services/iipimage build (see .cork-build's
  # dcs-iipimage-server) - lighttpd.conf's FILESYSTEM_PREFIX is baked in at
  # build time to /opt/cask, matching the standardized CaskFS CAS mount path
  # used across argonath and dc-showcase - so IIIF identifiers are always
  # paths relative to that root, backed here by the same caskfs_data volume
  # argonath's own `cask` service writes to (CaskFS's CAS root), read-only.
  iiif:
    image: ${IMAGE_DC_SHOWCASE_DCS_IIPIMAGE_SERVER}
    volumes:
      - shared-cask-data:/opt/cask:ro
    ports:
      - "8080:80"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.4.3
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - xpack.security.enabled=false
      - telemetry.enabled=false
    depends_on:
      - elasticsearch

networks:
  argonath-shared:
    external: true
    name: argonath-shared

volumes:
  pg_data:
    driver: local
  es_data:
    driver: local
  shared-cask-data:
    external: true
    name: argonath_caskfs_data
