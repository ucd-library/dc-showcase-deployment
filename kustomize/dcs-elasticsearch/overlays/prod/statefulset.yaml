apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dcs-elasticsearch
spec:
  template:
    spec:
      # Full affinity block repeated here (not just nodeAffinity added) -
      # kustomize's strategic-merge patch replaces the whole `affinity` map
      # rather than deep-merging independent affinity types, so the
      # podAntiAffinity from base must be restated alongside nodeAffinity.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: dcs-elasticsearch
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: intended-for
                    operator: In
                    values:
                      - argonath-prod-frontend
                      - es-quorum
      containers:
        - name: elasticsearch
          # TODO: no cork-build-registry wiring yet for dc-showcase - pin a
          # real built tag here before first deploy.
          image: us-west1-docker.pkg.dev/argonath-508815/pub/dcs-elastic-search:0.1.0
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: microk8s-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
