apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dcs-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10G"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: vpn-ingress
  tls:
  - hosts:
    - digital-collections.library.ucdavis.edu
    secretName: argonath-wildcard-tls
  rules:
  - host: digital-collections.library.ucdavis.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dcs-gateway
            port:
              number: 3002
